<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Capture Owner Dashboard</title>
  <style>
    :root{font:16px/1.5 system-ui,sans-serif;color:#17211e;background:#f3f6f4}body{max-width:60rem;margin:3rem auto;padding:0 1rem}main{background:#fff;border:1px solid #d8e0dc;border-radius:1rem;padding:1.5rem}h1{font-size:1.7rem}label{display:block;margin:.75rem 0 .25rem;font-weight:650}input{width:min(100%,32rem);min-height:2.6rem;padding:.5rem .7rem;border:1px solid #87958f;border-radius:.4rem;font:inherit}button{min-height:2.6rem;margin-top:.75rem;padding:.5rem .9rem;border:0;border-radius:.4rem;background:#17634f;color:white;font:inherit;font-weight:700}button:focus,input:focus{outline:3px solid #2f7a67;outline-offset:2px}p[role=status]{min-height:1.5rem}table{width:100%;border-collapse:collapse;margin:1rem 0}th,td{text-align:left;border-bottom:1px solid #d8e0dc;padding:.55rem .4rem}th{background:#f3f6f4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f4;padding:.8rem;border-radius:.5rem}
  </style>
</head>
<body>
<main>
  <h1>Owner dashboard</h1>
  <p>Local demo only. Paste a seeded owner token; it stays in this page's memory and is not saved.</p>
  <form id="load-dashboard">
    <label for="owner-token">Owner bearer token</label>
    <input id="owner-token" type="password" autocomplete="off" required>
    <button type="submit">Load stats</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="results" hidden>
    <h2>Daily submissions</h2><table><thead><tr><th>Date</th><th>Count</th></tr></thead><tbody id="daily"></tbody></table>
    <h2>By widget</h2><table><thead><tr><th>Widget</th><th>Title</th><th>Count</th></tr></thead><tbody id="widgets"></tbody></table>
    <h2>By country</h2><table><thead><tr><th>Country</th><th>Count</th></tr></thead><tbody id="countries"></tbody></table>
    <p id="total"></p>
  </section>
</main>
<script>
  const form = document.querySelector("#load-dashboard");
  const status = document.querySelector("#status");
  const results = document.querySelector("#results");
  function cell(row, value, tag) { const item = document.createElement(tag || "td"); item.textContent = String(value); row.appendChild(item); }
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    status.textContent = "Loading…";
    results.hidden = true;
    try {
      const response = await fetch("/api/dashboard/summary", {headers:{Authorization:"Bearer " + document.querySelector("#owner-token").value}});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error?.message || "Could not load dashboard.");
      const fill = (selector, rows, keys) => {
        const body = document.querySelector(selector); body.replaceChildren();
        rows.forEach(item => { const row = document.createElement("tr"); keys.forEach(key => cell(row, item[key] ?? "Unenriched")); body.appendChild(row); });
      };
      fill("#daily", data.daily, ["day", "count"]);
      fill("#widgets", data.by_widget, ["widget_id", "title", "count"]);
      fill("#countries", data.by_country, ["country", "count"]);
      document.querySelector("#total").textContent = "Total submissions: " + data.total_submissions;
      results.hidden = false;
      status.textContent = "Dashboard loaded.";
    } catch (error) {
      status.textContent = error.message;
    }
  });
</script>
</body>
</html>
